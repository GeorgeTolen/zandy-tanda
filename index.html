<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Заңды таңда</title>
<meta name="description" content="«Заңды таңда» интерактивті ойыны: заң мен тәртіп туралы 10 сұрақ.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3a6e'/%3E%3Cpath d='M32 12v38M18 50h28M14 22h36' stroke='%23f2c14e' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M14 22l-7 14h14zM50 22l-7 14h14z' fill='%23f2c14e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f3a6e;--navy2:#2c4f8f;--ink:#22304a;--muted:#5b6782;
  --bg:#f7f3ec;--card:#ffffff;
  --pink:#f9d3da;--pink2:#e8798c;--blue:#cfe2f7;--blue2:#5b8fd6;
  --green:#d6eedb;--green2:#3c9a5f;--yellow:#fbe9b7;--gold:#f2b632;
  --purple:#e5d9f5;--purple2:#8a6cc9;--red:#e05a5a;
  --shadow:0 10px 30px rgba(31,58,110,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);background:var(--bg);overflow-x:hidden;
}
button{font:inherit;cursor:pointer;border:0;color:inherit}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:var(--pink);top:-80px;left:-90px}
.b2{width:300px;height:300px;background:var(--blue);bottom:-60px;right:-70px;animation-delay:-6s}
.b3{width:240px;height:240px;background:var(--green);top:40%;left:60%;animation-delay:-11s}
.b4{width:220px;height:220px;background:var(--yellow);top:62%;left:-60px;animation-delay:-3s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}
.deco{position:absolute;opacity:.12;animation:float 9s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-18px) rotate(8deg)}}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}

#app{position:relative;z-index:1;min-height:100%;display:flex;align-items:center;justify-content:center;padding:18px 14px 28px}
.screen{width:100%;max-width:640px;display:none}
.screen.on{display:block;animation:screenIn .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes screenIn{from{opacity:0;transform:translateY(24px) scale(.97)}}

.card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:26px 22px}

/* ---------- START ---------- */
.hero{text-align:center}
.hero .scale{width:132px;height:132px;margin:0 auto 4px;display:block}
.title{font-size:clamp(34px,8vw,52px);font-weight:900;color:var(--navy);margin:2px 0 4px;letter-spacing:-.5px;line-height:1.05}
.title span{display:inline-block;animation:jump 2.4s ease-in-out infinite}
.title span:nth-child(2){animation-delay:.15s}
@keyframes jump{0%,70%,100%{transform:none}80%{transform:translateY(-8px) rotate(-3deg)}90%{transform:translateY(0) rotate(2deg)}}
.tag{display:inline-block;background:var(--blue);color:var(--navy);font-weight:800;font-size:14px;padding:6px 14px;border-radius:999px;margin-bottom:6px}
.slogan{color:var(--muted);font-weight:700;margin:8px 0 18px;font-size:15px}
.field{display:flex;flex-direction:column;gap:8px;margin:0 auto 14px;max-width:360px;text-align:left}
.field label{font-weight:800;font-size:14px;color:var(--navy)}
.field input{font:inherit;font-weight:800;font-size:18px;padding:14px 16px;border-radius:16px;border:3px solid var(--blue);outline:none;background:#fbfdff;color:var(--ink);transition:border-color .2s,transform .2s}
.field input:focus{border-color:var(--blue2);transform:scale(1.02)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:19px;padding:15px 30px;border-radius:18px;background:var(--navy);color:#fff;box-shadow:0 6px 0 #142a52;transition:transform .12s,box-shadow .12s,background .2s}
.btn:hover{background:var(--navy2)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #142a52}
.btn.gold{background:var(--gold);color:#3b2a05;box-shadow:0 6px 0 #c48c12}
.btn.gold:active{box-shadow:0 1px 0 #c48c12}
.btn.ghost{background:var(--blue);color:var(--navy);box-shadow:0 6px 0 #a9c6ea}
.btn.ghost:active{box-shadow:0 1px 0 #a9c6ea}
.btn.big{width:100%;max-width:360px}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 4px}
.rule{border-radius:18px;padding:12px 8px;text-align:center;font-weight:800;font-size:13px;line-height:1.25}
.rule b{display:block;font-size:24px;font-weight:900;margin-bottom:2px}
.rule:nth-child(1){background:var(--pink)}
.rule:nth-child(2){background:var(--green)}
.rule:nth-child(3){background:var(--yellow)}
.board{margin-top:20px;text-align:left}
.board h3{margin:0 0 10px;font-size:17px;color:var(--navy);display:flex;align-items:center;gap:8px}
.board ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{display:flex;align-items:center;gap:10px;background:#f4f6fb;border-radius:12px;padding:8px 12px;font-weight:800}
.board li .pos{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--blue);color:var(--navy);flex:none}
.board li:nth-child(1) .pos{background:var(--gold);color:#3b2a05}
.board li:nth-child(2) .pos{background:#cfd6e3}
.board li:nth-child(3) .pos{background:#e9b98c}
.board li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .pt{color:var(--navy)}
.board li.me{background:var(--yellow);animation:pop .6s}
.board .empty{color:var(--muted);font-weight:700;font-size:14px}

/* ---------- GAME ---------- */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chip{background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:8px 14px;font-weight:900;display:flex;align-items:center;gap:8px;font-size:16px}
.chip small{font-size:11px;color:var(--muted);font-weight:800;display:block;line-height:1;letter-spacing:.3px}
.score-val{font-size:22px;color:var(--navy);line-height:1}
.chip.player{flex:1;min-width:0}
.chip.player .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
.score-chip.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.18)}}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 12px}
.dot{width:24px;height:8px;border-radius:99px;background:#dde3ee;transition:background .3s,transform .3s}
.dot.cur{background:var(--blue2);transform:scaleY(1.4)}
.dot.ok{background:var(--green2)}
.dot.no{background:var(--red)}
.timer{height:12px;background:#e6ebf3;border-radius:99px;overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green2),#7cc78f);border-radius:99px;transform-origin:left}
.timer.warn i{background:linear-gradient(90deg,var(--red),#f08b6b)}
.timer.warn{animation:shakeS .3s infinite}
@keyframes shakeS{25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}

.qcard{position:relative;overflow:hidden}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qnum{background:var(--pink);color:#8e2e40;font-weight:900;border-radius:12px;padding:6px 12px;font-size:14px;flex:none}
.combo{margin-left:auto;font-weight:900;font-size:14px;padding:6px 12px;border-radius:12px;background:var(--yellow);color:#7a5200;display:flex;align-items:center;gap:6px;opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.combo.on{opacity:1;transform:scale(1)}
.combo svg{width:16px;height:16px}
.qtext{font-size:clamp(19px,4.6vw,24px);font-weight:900;line-height:1.3;margin:0 0 18px;color:var(--navy)}
.qtext.in{animation:qIn .45s ease-out}
@keyframes qIn{from{opacity:0;transform:translateX(30px)}}
.answers{display:flex;flex-direction:column;gap:12px}
.ans{display:flex;align-items:center;gap:14px;text-align:left;background:#f4f7fc;border:3px solid #e1e8f3;border-radius:18px;padding:14px 14px;font-weight:800;font-size:17px;line-height:1.3;transition:transform .15s,background .2s,border-color .2s,opacity .3s;position:relative;opacity:0;animation:ansIn .45s forwards}
.ans:nth-child(1){animation-delay:.08s}.ans:nth-child(2){animation-delay:.16s}.ans:nth-child(3){animation-delay:.24s}
@keyframes ansIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ans:not(:disabled):hover{transform:translateY(-2px) scale(1.01);border-color:var(--blue2);background:#eef4ff}
.ans:not(:disabled):active{transform:scale(.98)}
.ans .let{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:19px;flex:none;color:#fff}
.ans:nth-child(1) .let{background:var(--pink2)}
.ans:nth-child(2) .let{background:var(--blue2)}
.ans:nth-child(3) .let{background:var(--purple2)}
.ans .txt{flex:1}
.ans .mk{width:30px;height:30px;flex:none;opacity:0;transform:scale(0)}
.ans:disabled{cursor:default}
.ans.right{background:var(--green);border-color:var(--green2);animation:none;opacity:1;animation:rightPop .5s}
.ans.right .mk,.ans.bad .mk{opacity:1;transform:scale(1);transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.ans.bad{background:#fde2e2;border-color:var(--red);opacity:1;animation:shake .45s}
.ans.dim{opacity:.4 !important}
.ans.gone{opacity:.18 !important;transform:scale(.96);pointer-events:none;filter:grayscale(1)}
@keyframes rightPop{40%{transform:scale(1.04)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tools{display:flex;gap:10px;margin-top:16px;align-items:center}
.help{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;padding:10px 16px;border-radius:14px;background:var(--purple);color:#4b2f8a;transition:transform .15s,opacity .2s}
.help:active{transform:scale(.95)}
.help:disabled{opacity:.4;cursor:default}
.help svg{width:18px;height:18px}
.next{margin-left:auto;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .25s,transform .25s;padding:12px 22px;font-size:17px}
.next.on{opacity:1;pointer-events:auto;transform:none}
.verdict{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.3) rotate(-8deg);font-size:clamp(34px,9vw,50px);font-weight:900;padding:8px 24px;border-radius:20px;opacity:0;pointer-events:none;white-space:nowrap;z-index:3}
.verdict.ok{background:var(--green2);color:#fff;box-shadow:0 8px 0 #2a7146}
.verdict.no{background:var(--red);color:#fff;box-shadow:0 8px 0 #a63a3a}
.verdict.show{animation:verdict 1.1s forwards}
@keyframes verdict{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(-4deg)}40%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1) rotate(-4deg)}}
.floater{position:fixed;z-index:60;font-weight:900;font-size:26px;color:var(--green2);pointer-events:none;animation:floatUp 1.2s ease-out forwards;text-shadow:0 2px 0 #fff,0 0 12px #fff}
@keyframes floatUp{from{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}to{opacity:0;transform:translate(-50%,-80px) scale(1)}}
.mascot{position:absolute;right:-6px;bottom:-10px;width:90px;opacity:.16;pointer-events:none}

/* ---------- END ---------- */
.end{text-align:center}
.stars{display:flex;justify-content:center;gap:8px;margin:0 0 6px}
.stars svg{width:62px;height:62px;opacity:0;transform:scale(0) rotate(-40deg)}
.stars svg:nth-child(2){width:76px;height:76px;margin-top:-12px}
.stars svg.on{animation:starIn .55s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes starIn{to{opacity:1;transform:none}}
.stars svg .fill{fill:#e3e7ef}
.stars svg.got .fill{fill:var(--gold)}
.rank{display:inline-block;font-size:clamp(26px,6.5vw,36px);font-weight:900;color:var(--navy);margin:6px 0 2px}
.rank-sub{color:var(--muted);font-weight:700;margin:0 0 16px}
.bigscore{font-size:64px;font-weight:900;color:var(--navy);line-height:1;margin:6px 0 2px}
.bigscore-l{font-weight:800;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{border-radius:18px;padding:12px 6px;font-weight:800;font-size:13px}
.stat b{display:block;font-size:24px;font-weight:900}
.stat:nth-child(1){background:var(--green)}
.stat:nth-child(2){background:var(--yellow)}
.stat:nth-child(3){background:var(--blue)}
.end-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.motto{margin-top:18px;display:inline-block;background:var(--yellow);padding:8px 16px;border-radius:12px;font-weight:900;color:#7a5200;transform:rotate(-2deg)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.05)}}

/* scale mascot animation */
.beam{transform-origin:60px 34px;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.pan{transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.scale.idle .beam{animation:swing 3.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}

@media (max-width:420px){
  .card{padding:20px 16px;border-radius:22px}
  .rules,.stats{gap:7px}
  .rule{font-size:12px}
  .ans{font-size:16px;padding:12px}
  .ans .let{width:36px;height:36px}
  .dot{width:18px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>
</head>
<body>
<div id="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <svg class="deco" style="top:8%;right:8%;width:70px" viewBox="0 0 64 64"><rect x="10" y="8" width="44" height="50" rx="6" fill="#1f3a6e"/><rect x="16" y="14" width="32" height="6" rx="3" fill="#fff"/></svg>
  <svg class="deco" style="bottom:12%;left:7%;width:80px;animation-delay:-4s" viewBox="0 0 64 64"><rect x="14" y="10" width="30" height="16" rx="5" transform="rotate(-30 29 18)" fill="#8a5a2b"/><rect x="28" y="24" width="7" height="36" rx="3" transform="rotate(-30 31 42)" fill="#8a5a2b"/></svg>
  <svg class="deco" style="top:52%;right:5%;width:60px;animation-delay:-2s" viewBox="0 0 64 64"><path d="M32 6l7 16 17 2-13 11 4 17-15-9-15 9 4-17L8 24l17-2z" fill="#f2b632"/></svg>
</div>
<canvas id="fx"></canvas>

<div id="app">

  <!-- START -->
  <section class="screen on" id="start">
    <div class="card hero">
      <svg class="scale idle" id="heroScale" viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="110" rx="34" ry="6" fill="#1f3a6e" opacity=".12"/>
        <rect x="56" y="30" width="8" height="70" rx="4" fill="#c88f1d"/>
        <rect x="36" y="96" width="48" height="10" rx="5" fill="#1f3a6e"/>
        <circle cx="60" cy="26" r="8" fill="#f2b632"/>
        <g class="beam">
          <rect x="14" y="31" width="92" height="7" rx="3.5" fill="#f2b632"/>
          <g class="pan"><path d="M20 38 L10 66 M20 38 L30 66" stroke="#c88f1d" stroke-width="2"/><path d="M4 66 h32 a16 9 0 0 1 -32 0z" fill="#f2b632"/></g>
          <g class="pan"><path d="M100 38 L90 66 M100 38 L110 66" stroke="#c88f1d" stroke-width="2"/><path d="M84 66 h32 a16 9 0 0 1 -32 0z" fill="#f2b632"/></g>
        </g>
      </svg>
      <div class="tag">Интерактивті ойын</div>
      <h1 class="title"><span>Заңды</span> <span>таңда!</span></h1>
      <p class="slogan">Заң – тәртіптің негізі, ал тәртіп – бейбіт өмір кепілі!</p>

      <div class="field">
        <label for="name">Атыңды жаз</label>
        <input id="name" maxlength="18" autocomplete="off" placeholder="Мысалы: Айгерім">
      </div>
      <button class="btn big pulse" id="go">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>
        Ойынды бастау
      </button>

      <div class="rules">
        <div class="rule"><b>10</b>сұрақ</div>
        <div class="rule"><b>20с</b>әр сұраққа</div>
        <div class="rule"><b>x2</b>қатарынан дұрыс</div>
      </div>

      <div class="board" id="board1"></div>
    </div>
  </section>

  <!-- GAME -->
  <section class="screen" id="game">
    <div class="hud">
      <div class="chip player"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#5b8fd6"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" fill="#5b8fd6"/></svg><span class="nm" id="pName">Ойыншы</span></div>
      <div class="chip score-chip" id="scoreChip"><div><small>ҰПАЙ</small><span class="score-val" id="score">0</span></div></div>
      <button class="icon-btn" id="snd" aria-label="Дыбыс"></button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="timer" id="timer"><i id="timeBar"></i></div>

    <div class="card qcard">
      <svg class="mascot" viewBox="0 0 120 120" aria-hidden="true"><rect x="56" y="30" width="8" height="70" fill="#1f3a6e"/><rect x="14" y="31" width="92" height="7" fill="#1f3a6e"/><path d="M4 66h32a16 9 0 0 1-32 0zM84 66h32a16 9 0 0 1-32 0z" fill="#1f3a6e"/></svg>
      <div class="qhead">
        <div class="qnum" id="qnum">1 / 10</div>
        <div class="combo" id="combo"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z" fill="#e8742a"/></svg><span id="comboTxt">x1.5</span></div>
      </div>
      <p class="qtext" id="qtext"></p>
      <div class="answers" id="answers"></div>
      <div class="tools">
        <button class="help" id="help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.7M12 17.5v.1" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>Көмек <span id="helpN">2</span></button>
        <button class="btn next" id="next">Келесі
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="verdict" id="verdict"></div>
    </div>
  </section>

  <!-- END -->
  <section class="screen" id="end">
    <div class="card end">
      <div class="stars" id="stars"></div>
      <div class="rank" id="rank"></div>
      <p class="rank-sub" id="rankSub"></p>
      <div class="bigscore" id="final">0</div>
      <div class="bigscore-l">ұпай жинадың</div>
      <div class="stats">
        <div class="stat"><b id="stOk">0/10</b>дұрыс жауап</div>
        <div class="stat"><b id="stStreak">0</b>ең ұзын серия</div>
        <div class="stat"><b id="stTime">0с</b>орташа уақыт</div>
      </div>
      <div class="board" id="board2"></div>
      <div class="end-btns">
        <button class="btn gold" id="again"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Қайта ойнау</button>
        <button class="btn ghost" id="newPlayer">Келесі ойыншы</button>
      </div>
      <div class="motto">Әр заң – жақсы болашаққа жол!</div>
    </div>
  </section>
</div>

<script>
(function(){
"use strict";

/* ===== Questions ===== */
const QUESTIONS = [
  {q:"Құқықтық нормалардың негізгі мақсаты қандай?",
   a:["Мемлекеттік билікті күшейту","Қоғамдық қатынастарды реттеу","Азаматтардың еркіндігін шектеу"],c:1},
  {q:"Құқықтық мемлекетке тән басты белгі қандай?",
   a:["Заңның үстемдігі","Бір адамның билігі","Азаматтардың жауапсыздығы"],c:0},
  {q:"Егер азаматтардың құқықтары қорғалмаса, қандай жағдай туындайды?",
   a:["Әлеуметтік теңсіздік пен әділетсіздік күшейеді","Қоғамдық тәртіп жақсарады","Заңның маңызы артады"],c:0},
  {q:"Заң алдында барлық азаматтардың тең болуы нені білдіреді?",
   a:["Әр адамға әртүрлі талап қойылады","Барлығы заң талаптарын бірдей орындауы тиіс","Кейбір адамдар заңға бағынбайды"],c:1},
  {q:"Құқықтық жауапкершіліктің негізгі міндеті қандай?",
   a:["Адамдарды жазалау ғана","Заң бұзушылықтың алдын алу және тәртіпті сақтау","Азаматтардың құқықтарын шектеу"],c:1},
  {q:"Егер кәсіпорын қоршаған ортаны ластаса, қандай шара қолданылуы мүмкін?",
   a:["Жауапкершілікке тарту","Ескерусіз қалдыру","Басқа кәсіпорындарға рұқсат беру"],c:0},
  {q:"Құқықтық нормалар уақытша орындалмаса, қоғамға қандай қауіп төнеді?",
   a:["Қоғамдағы тұрақтылық әлсірейді","Азаматтардың жауапкершілігі артады","Құқықтық мәдениет жоғарылайды"],c:0},
  {q:"Азамат өз құқығын қорғау үшін не істеуі керек?",
   a:["Заңды өз бетінше бұзуы керек","Заңда белгіленген тәртіппен тиісті органдарға жүгінуі керек","Мәселені күшпен шешуі керек"],c:1},
  {q:"Қоғамдық тәртіптің бұзылуы қандай салдарға әкелуі мүмкін?",
   a:["Қақтығыстар мен құқық бұзушылықтардың көбеюіне","Қоғамдағы сенімділіктің артуына","Заңның нығаюына"],c:0},
  {q:"Заң мен қоғам арасындағы байланыс қандай?",
   a:["Заң қоғам өміріне әсер етпейді","Заң қоғамдық қатынастарды реттеп, тұрақтылықты қамтамасыз етеді","Заң тек мемлекеттік органдарға қажет"],c:1}
];
const LETTERS = ["А","Ә","Б"];
const TIME = 20;
const HELPS = 2;
const LB_KEY = "zandy-tanda-board-v1";

/* ===== Helpers ===== */
const $ = id => document.getElementById(id);
const shuffle = arr => { const a = arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

/* ===== Sound (Web Audio, no files) ===== */
let actx = null;
let soundOn = true;
try { soundOn = localStorage.getItem("zt-sound") !== "0"; } catch(e){}
function ac(){
  if(!actx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; actx = new C(); }
  if(actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, when, slide){
  if(!soundOn) return; const c = ac(); if(!c) return;
  const t = c.currentTime + (when||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || .2, t + .012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + .03);
}
function noise(dur, vol, when, hp){
  if(!soundOn) return; const c = ac(); if(!c) return;
  const t = c.currentTime + (when||0);
  const len = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const s = c.createBufferSource(); s.buffer = buf;
  const f = c.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp || 800;
  const g = c.createGain(); g.gain.value = vol || .2;
  s.connect(f).connect(g).connect(c.destination); s.start(t);
}
const SFX = {
  click(){ tone(700,.07,"triangle",.14); },
  hover(){ tone(1100,.03,"sine",.04); },
  start(){ [392,523,659,784].forEach((f,i)=>tone(f,.16,"square",.07,i*.07)); },
  correct(){ [523,659,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.2,i*.075)); tone(1568,.25,"sine",.08,.3); },
  combo(){ [784,988,1175,1568,1976].forEach((f,i)=>tone(f,.13,"square",.06,i*.05)); },
  wrong(){ tone(240,.38,"sawtooth",.12,0,110); tone(200,.38,"square",.05,.06,95); },
  tick(){ tone(1500,.035,"square",.05); },
  timeout(){ tone(440,.15,"square",.08); tone(330,.15,"square",.08,.16); tone(220,.35,"square",.08,.32); },
  gavel(){ tone(160,.22,"sine",.5,0,45); noise(.08,.25,0,1500); },
  help(){ tone(600,.08,"sine",.12); tone(900,.08,"sine",.12,.08); tone(1200,.14,"sine",.12,.16); },
  win(){
    const m=[523,523,523,659,784,659,784,1047];
    const d=[.12,.12,.12,.3,.15,.15,.15,.6];
    let t=0; m.forEach((f,i)=>{ tone(f,d[i]+.05,"square",.08,t); tone(f/2,d[i]+.05,"triangle",.1,t); t+=d[i]; });
  },
  sad(){ [392,370,349,330].forEach((f,i)=>tone(f,.3,"triangle",.12,i*.25)); }
};
const SND_ON = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#1f3a6e"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#1f3a6e" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>';
const SND_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#9aa5ba"/><path d="M16 9l6 6M22 9l-6 6" stroke="#e05a5a" stroke-width="2.4" stroke-linecap="round"/></svg>';
function paintSound(){ $("snd").innerHTML = soundOn ? SND_ON : SND_OFF; }

/* ===== Confetti ===== */
const cv = $("fx"), cx = cv.getContext("2d");
let parts = [], fxRunning = false;
function fitCanvas(){ const r = window.devicePixelRatio||1; cv.width = innerWidth*r; cv.height = innerHeight*r; cv.style.width = innerWidth+"px"; cv.style.height = innerHeight+"px"; cx.setTransform(r,0,0,r,0,0); }
fitCanvas(); addEventListener("resize", fitCanvas);
const COLORS = ["#f2b632","#e8798c","#5b8fd6","#3c9a5f","#8a6cc9","#1f3a6e"];
function burst(x, y, n, spread){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 3 + Math.random()*(spread||7);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s - 4,w:6+Math.random()*7,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:COLORS[Math.random()*COLORS.length|0],life:90+Math.random()*50,shape:Math.random()<.3?1:0});
  }
  if(!fxRunning){ fxRunning = true; requestAnimationFrame(loop); }
}
function rain(n){
  for(let i=0;i<n;i++){
    parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,w:7+Math.random()*7,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:COLORS[Math.random()*COLORS.length|0],life:260,shape:Math.random()<.3?1:0});
  }
  if(!fxRunning){ fxRunning = true; requestAnimationFrame(loop); }
}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  for(const p of parts){
    p.vy += .18; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha = Math.min(1, p.life/30);
    cx.fillStyle = p.c;
    if(p.shape){ cx.beginPath(); cx.arc(0,0,p.w/2.4,0,Math.PI*2); cx.fill(); }
    else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.restore();
  }
  if(parts.length) requestAnimationFrame(loop); else { fxRunning = false; cx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ===== Leaderboard ===== */
function loadBoard(){ try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch(e){ return []; } }
function saveBoard(b){ try { localStorage.setItem(LB_KEY, JSON.stringify(b)); } catch(e){} }
function renderBoard(el, meId){
  const b = loadBoard().slice(0,7);
  const trophy = '<svg width="20" height="20" viewBox="0 0 24 24"><path d="M7 3h10v5a5 5 0 0 1-10 0z" fill="#f2b632"/><path d="M7 5H3v2a4 4 0 0 0 4 4M17 5h4v2a4 4 0 0 1-4 4" stroke="#f2b632" stroke-width="2" fill="none"/><rect x="10" y="13" width="4" height="5" fill="#c88f1d"/><rect x="7" y="18" width="10" height="3" rx="1.5" fill="#1f3a6e"/></svg>';
  el.innerHTML = '<h3>'+trophy+'Үздіктер тақтасы</h3>' + (b.length
    ? '<ol>' + b.map((r,i)=>'<li class="'+(r.id===meId?'me':'')+'"><span class="pos">'+(i+1)+'</span><span class="nm">'+esc(r.name)+'</span><span class="pt">'+r.score+'</span></li>').join("") + '</ol>'
    : '<div class="empty">Әзірге ешкім ойнаған жоқ. Бірінші бол!</div>');
}

/* ===== Game state ===== */
let order, qi, score, streak, bestStreak, okCount, helps, answered, tStart, tLeft, raf, lastTick, times, shownScore, curMap, player = "";

const CHECK = '<svg class="mk" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#3c9a5f"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CROSS = '<svg class="mk" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#e05a5a"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></svg>';

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $(id).classList.add("on");
  window.scrollTo({top:0,behavior:"smooth"});
}

function startGame(){
  player = ($("name").value.trim() || "Ойыншы").slice(0,18);
  try { localStorage.setItem("zt-name", player); } catch(e){}
  $("pName").textContent = player;
  order = shuffle(QUESTIONS.map((_,i)=>i));
  qi = 0; score = 0; shownScore = 0; streak = 0; bestStreak = 0; okCount = 0; helps = HELPS; times = [];
  $("score").textContent = "0";
  $("helpN").textContent = helps; $("help").disabled = false;
  $("dots").innerHTML = QUESTIONS.map(()=>'<span class="dot"></span>').join("");
  SFX.start();
  show("game");
  setTimeout(loadQuestion, 250);
}

function loadQuestion(){
  answered = false;
  const Q = QUESTIONS[order[qi]];
  curMap = shuffle([0,1,2]);          // shuffled answer positions
  $("qnum").textContent = (qi+1) + " / " + QUESTIONS.length;
  const qt = $("qtext"); qt.classList.remove("in"); void qt.offsetWidth; qt.textContent = Q.q; qt.classList.add("in");
  $("answers").innerHTML = curMap.map((orig,pos) =>
    '<button class="ans" data-o="'+orig+'"><span class="let">'+LETTERS[pos]+'</span><span class="txt">'+esc(Q.a[orig])+'</span></button>'
  ).join("");
  document.querySelectorAll(".ans").forEach(b => {
    b.addEventListener("click", () => choose(b));
    b.addEventListener("mouseenter", () => { if(!answered) SFX.hover(); });
  });
  document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("cur", i===qi));
  $("next").classList.remove("on");
  $("help").disabled = helps <= 0;
  updateCombo();
  startTimer();
}

function startTimer(){
  cancelAnimationFrame(raf);
  tStart = performance.now(); tLeft = TIME; lastTick = TIME;
  $("timer").classList.remove("warn");
  const bar = $("timeBar");
  const step = now => {
    if(answered) return;
    tLeft = Math.max(0, TIME - (now - tStart)/1000);
    bar.style.transform = "scaleX(" + (tLeft/TIME) + ")";
    if(tLeft <= 5){
      $("timer").classList.add("warn");
      const s = Math.ceil(tLeft);
      if(s < lastTick){ lastTick = s; SFX.tick(); }
    }
    if(tLeft <= 0){ timeUp(); return; }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

function multiplier(){ return streak >= 5 ? 2 : streak >= 3 ? 1.5 : 1; }
function updateCombo(){
  const m = multiplier();
  $("combo").classList.toggle("on", m > 1);
  $("comboTxt").textContent = "x" + m + " серия " + streak;
}

function choose(btn){
  if(answered) return;
  answered = true; cancelAnimationFrame(raf);
  const Q = QUESTIONS[order[qi]];
  const pick = +btn.dataset.o;
  const used = TIME - tLeft; times.push(used);
  const buttons = [...document.querySelectorAll(".ans")];
  buttons.forEach(b => b.disabled = true);
  const dot = document.querySelectorAll(".dot")[qi];

  if(pick === Q.c){
    streak++; okCount++; bestStreak = Math.max(bestStreak, streak);
    const pts = Math.round((100 + Math.round(tLeft/TIME*100)) * multiplier());
    score += pts;
    btn.classList.add("right"); btn.insertAdjacentHTML("beforeend", CHECK);
    buttons.forEach(b => { if(b!==btn) b.classList.add("dim"); });
    dot.classList.add("ok");
    verdict("Дұрыс!", true);
    const r = btn.getBoundingClientRect();
    floater("+" + pts, r.left + r.width/2, r.top);
    burst(r.left + r.width/2, r.top + r.height/2, 40);
    SFX.correct(); if(streak === 3 || streak === 5) setTimeout(SFX.combo, 350);
    animateScore();
    tiltMascot(true);
  } else {
    streak = 0;
    btn.classList.add("bad"); btn.insertAdjacentHTML("beforeend", CROSS);
    revealRight(buttons, Q.c, btn);
    dot.classList.add("no");
    verdict("Қате!", false);
    SFX.wrong();
    tiltMascot(false);
  }
  updateCombo();
  setTimeout(()=>$("next").classList.add("on"), 650);
}

function revealRight(buttons, correct, except){
  buttons.forEach(b => {
    if(+b.dataset.o === correct){ b.classList.remove("gone","dim"); b.classList.add("right"); b.insertAdjacentHTML("beforeend", CHECK); }
    else if(b !== except) b.classList.add("dim");
  });
}

function timeUp(){
  if(answered) return;
  answered = true; times.push(TIME); streak = 0;
  const buttons = [...document.querySelectorAll(".ans")];
  buttons.forEach(b => b.disabled = true);
  revealRight(buttons, QUESTIONS[order[qi]].c, null);
  document.querySelectorAll(".dot")[qi].classList.add("no");
  verdict("Уақыт бітті!", false);
  SFX.timeout(); updateCombo();
  setTimeout(()=>$("next").classList.add("on"), 650);
}

function useHelp(){
  if(answered || helps <= 0) return;
  const Q = QUESTIONS[order[qi]];
  const wrong = [...document.querySelectorAll(".ans")].filter(b => +b.dataset.o !== Q.c && !b.classList.contains("gone"));
  if(wrong.length < 2) return;
  const b = wrong[Math.random()*wrong.length|0];
  b.classList.add("gone"); b.disabled = true;
  helps--; $("helpN").textContent = helps; $("help").disabled = true;
  SFX.help();
}

function nextQ(){
  if(!answered) return;
  SFX.click();
  qi++;
  if(qi >= QUESTIONS.length) finish(); else loadQuestion();
}

function verdict(text, ok){
  const v = $("verdict");
  v.className = "verdict"; void v.offsetWidth;
  v.textContent = text; v.classList.add(ok ? "ok" : "no", "show");
}
function floater(text, x, y){
  const f = document.createElement("div");
  f.className = "floater"; f.textContent = text;
  f.style.left = x + "px"; f.style.top = y + "px";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(), 1300);
}
function animateScore(){
  const chip = $("scoreChip"); chip.classList.remove("bump"); void chip.offsetWidth; chip.classList.add("bump");
  const from = shownScore, to = score, t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0)/600);
    shownScore = Math.round(from + (to - from) * (1 - Math.pow(1-k,3)));
    $("score").textContent = shownScore;
    if(k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function tiltMascot(ok){
  const m = document.querySelector(".mascot");
  m.animate(ok
    ? [{transform:"rotate(0) scale(1)",opacity:.16},{transform:"rotate(-12deg) scale(1.25)",opacity:.35},{transform:"rotate(0) scale(1)",opacity:.16}]
    : [{transform:"rotate(0)"},{transform:"rotate(18deg)"},{transform:"rotate(-10deg)"},{transform:"rotate(0)"}],
    {duration:700,easing:"ease-out"});
}

/* ===== Finish ===== */
const RANKS = [
  {min:10, t:"Заң білгірі!", s:"Керемет! Сен барлық сұраққа дұрыс жауап бердің.", stars:3},
  {min:8,  t:"Құқық қорғаушы", s:"Өте жақсы! Заңды жақсы білесің.", stars:3},
  {min:5,  t:"Белсенді азамат", s:"Жақсы нәтиже! Тағы біраз қайталасаң, шебер боласың.", stars:2},
  {min:0,  t:"Жас заңгер", s:"Бастама жақсы! Қайта ойнап, ұпайыңды арттыр.", stars:1}
];
function finish(){
  const R = RANKS.find(r => okCount >= r.min);
  const id = Date.now() + "-" + Math.random().toString(36).slice(2,7);
  const b = loadBoard(); b.push({id, name:player, score, ok:okCount});
  b.sort((x,y)=> y.score - x.score); saveBoard(b.slice(0,30));

  show("end");
  $("rank").textContent = R.t;
  $("rankSub").textContent = R.s;
  $("stOk").textContent = okCount + "/" + QUESTIONS.length;
  $("stStreak").textContent = bestStreak;
  $("stTime").textContent = (times.reduce((a,c)=>a+c,0)/times.length).toFixed(1) + "с";
  renderBoard($("board2"), id);

  const STAR = '<svg viewBox="0 0 24 24"><path class="fill" d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" stroke="#c88f1d" stroke-width="1"/></svg>';
  const st = $("stars"); st.innerHTML = STAR + STAR + STAR;
  [...st.children].forEach((s,i)=> setTimeout(()=>{
    s.classList.add("on"); if(i < R.stars){ s.classList.add("got"); tone(660 + i*220,.18,"triangle",.15); }
  }, 350 + i*280));

  const fin = $("final"), t0 = performance.now();
  const step = now => { const k = Math.min(1,(now-t0)/1400); fin.textContent = Math.round(score*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);

  if(R.stars >= 2){ setTimeout(SFX.win, 300); rain(R.stars === 3 ? 180 : 90); setTimeout(()=>burst(innerWidth/2, innerHeight/3, 80, 10), 500); }
  else setTimeout(SFX.sad, 300);
}

/* ===== Wire up ===== */
try { $("name").value = localStorage.getItem("zt-name") || ""; } catch(e){}
paintSound();
renderBoard($("board1"));
$("go").addEventListener("click", () => { ac(); SFX.gavel(); setTimeout(startGame, 180); });
$("name").addEventListener("keydown", e => { if(e.key === "Enter") $("go").click(); });
$("next").addEventListener("click", nextQ);
$("help").addEventListener("click", useHelp);
$("again").addEventListener("click", () => { SFX.click(); startGame(); });
$("newPlayer").addEventListener("click", () => { SFX.click(); $("name").value = ""; renderBoard($("board1")); show("start"); setTimeout(()=>$("name").focus(), 300); });
$("snd").addEventListener("click", () => { soundOn = !soundOn; try{localStorage.setItem("zt-sound", soundOn?"1":"0");}catch(e){} paintSound(); if(soundOn) SFX.click(); });
document.addEventListener("keydown", e => {
  if(!$("game").classList.contains("on")) return;
  const k = {"1":0,"2":1,"3":2}[e.key];
  if(k !== undefined && !answered){ const b = document.querySelectorAll(".ans")[k]; if(b && !b.disabled) b.click(); }
  if((e.key === "Enter" || e.key === " ") && answered){ e.preventDefault(); nextQ(); }
});
})();
</script>
</body>
</html>
